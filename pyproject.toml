[project]
name = "esl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]
# 대규모 쉘 솔버 (esl_core §7.5). backend="auto" 우선순위: cholmod → pardiso → superlu,
# 직접법 메모리 부족 예상 시 반복법(CG + pyamg). scikit-sparse 는 libsuitesparse(-dev) 필요(Windows 휠 없음).
fast = [
    "scikit-sparse>=0.4.12; sys_platform != 'win32'",
    "pypardiso>=0.4.6; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "pyamg>=5.0",
    "psutil",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["perf: 성능 측정(기준 초과는 경고 + 측정값 기록, 큰 초과만 실패)"]
