# ESL 계산 코어 설정 예시 (계약 docs/contracts/esl_core.md §5·§7, 원형 esl.md §2).
# 실제 사용: 이 파일을 config/esl.yaml 로 복사(git 제외)하거나 env ESL_CONFIG 로 경로 지정.
# 모든 키 필수(코드에 기본값 없음). 알 수 없는 키는 CONFIG_INVALID.
schema_version: 1

case:
  part_title: "chassis rear"         # 대상 /PART title
  part_title_match: exact_ci         # exact | exact_ci (공백·_·- 정규화 후 대소문자 무시)
  rad_include_max_depth: 8
  material_override: {}              # {mat_id: {E: , nu: }} — 파서 미지원 law 보완
  include_path_map: {}               # {Windows 접두: 로컬 경로} 예 {"D:/proj/cae": "/data/cae"} — #include 절대경로 치환
  # rad_max_line_kb: 1024            # (선택) rad·include·상태 파일 한 줄 상한(KB). 넘으면 RAD_PARSE_ERROR/STATE_PARSE_ERROR

extract:
  frame_stride: 1                    # history 프레임 간격(1=전부, 후보 프레임 D 는 항상 포함)
  layers: [mid]                      # 솔버 ε_eq 층: mid(막 z=0) | bottom | top (여럿이면 최대). h3d 는 Mid 만 있음
  shear_convention: auto             # auto | tensor | engineering  h3d exy 규약(auto = HyperView vonMises 와 비교)
  hot_k: 200                         # TCL 이력 집합 H = 최종 vm 상위 hot_k ∪ epsp 상위 hot_k (done.json 과 다르면 경고, 상한 없음·1000 초과 경고)
  disp_precision: float32            # float32 | float64  변위 결과 저장 정밀도(H3D 는 보통 float32) → S4 잡음 바닥 추정
  # (선택, v0.12.1) h3d 변형률 결과 대체 — 없으면 아래 값. 순서 = 우선순위, 목록 첫 번째로 결과·성분·층이 모두 있는 것 하나만 씀
  # strain_sources: [max_strain, plastic_strain, strain_tensor, max_stress]
  # result_names:                    # h3d 결과 유형 이름 후보(정확 일치 → 대소문자·공백·밑줄 무시 일치)
  #   max_strain: [Max_Strain]
  #   plastic_strain: [Plastic Strain, Plastic_Strain]
  #   strain_tensor: [Strain]        # 순간값 텐서(층별) → 코어가 ε_eq·층 최대·시간 누적 최대로 TMAX 재현(출력 프레임 표본)
  #   max_stress: [Max_Stress]       # 응력 기준 대체(순위·t* 용, 변형률 참고 지표 생략)
  # tensor_comps: {xx: [XX], yy: [YY], zz: [ZZ], xy: [XY]}
  # vm_comps: [vonMises, von Mises]
  # scalar_comps: [Scalar value, Scalar]
  # tensor_layer_exclude: [Max, Min] # Strain 텐서 층 목록에서 뺄 HyperView 파생 층
  # tensor_layer_prefer: [Lower, Upper] # (v0.12.2) Strain 텐서 우선 층(있는 것만, 대소문자·공백 무시), 하나도 없으면 전 층 − exclude
  # dump_keep: false                 # Strain 텐서 원자료(strain_raw.csv·disp.csv)를 변환 후 보존(기본 = 서버 추출 폴더에서 삭제)
  # dump_max_bytes: 42949672960      # 원자료 크기 상한(사전 추정·실제, 기본 40 GiB) — 넘으면 STRAIN_DUMP_TOO_LARGE

coord_check:                         # rad ↔ h3d 같은 모델 확인 = 노드 ID + 요소 연결(elems.csv). 좌표는 개략 확인만(계산 좌표는 항상 rad)
  max_rel: 0.005                     # Kabsch 강체 정합 후 잔차 최대 ≤ 이 값·bbox 이면 통과(편차는 정보로 기록), 넘으면 ID_MISMATCH

tstar:
  metric: max_strain                 # max_strain (Max_Strain 텐서 ε_eq) | plastic_strain. 두 지표 모두 tstar.json 에 기록
  reach_rtol: 1.0e-6                 # first-reach: v[f] ≥ v_final·(1−rtol) 인 첫 프레임
  top_n_times: 5                     # 후보 시점 수(지표별)
  top_k_hotspots: 10                 # t* 에서 상승 중인 H 요소 중 상위
  hotspot_min_dist: 20.0             # 모델 길이 단위. hotspot 간 최소 거리
  time_window: [null, null]          # [t_min, t_max] (null = 전체)
  exclude_elem_ids: []               # 특이점 제외용 요소 ID

support:
  candidates: pca4                   # pca4 (PCA 4꼭지점) | node_ids (아래 목록)
  node_ids: []                       # candidates=node_ids 일 때 3개 이상. CLI --support-nodes 가 우선
  # (선택, v0.10.0) ② t* 확정 시 3-2-1 자동 선택 품질 검사 기준(없으면 아래 기본값, 기준값 임시). 플랫폼 화면에서만 쓴다.
  # auto_check:
  #   min_area_ratio: 0.10             # 삼각형 면적 / (0.5·면내 범위 L_a·L_b) 미만 → SUPPORT_COLLINEAR
  #   min_dist_rel: 0.15               # 최소 두 점 거리 / 면내 대각선 미만 → SUPPORT_TOO_CLOSE
  #   min_cond_ratio: 1.0e-3           # 3-2-1 구속행렬 σmin/σmax 미만 → SUPPORT_ILL_CONDITIONED
  #   expand_candidates: true          # PCA 4꼭지점이 실패하면 a·b 극점까지 8개 후보 조합 재탐색
  #   rule_version: 1                  # 기록용

solver:
  backend: auto                      # auto(CHOLMOD → PARDISO → SuperLU, 직접법 메모리 부족 시 반복법) | cholmod | pardiso | superlu | iterative
  iter_rtol: 1.0e-10                 # 반복법(CG) 상대잔차. S5 전체계 solve 는 min(이 값, 1e-12)
  iter_maxiter: null                 # 반복법 최대 반복(null = 자동)
  drill_factor: 1.0e-4               # 드릴링 강성 = drill_factor·E·t·A
  equilibrium_warn_rel: 1.0e-6       # S4 |ΣF|/Σ|F|, 합모멘트/(Σ|F|·L) 경고 임계
  # (선택, v0.14.0) 자체 쉘 솔버 해 수용 검사(없으면 아래 기본값, opt_run.solver 에도 같은 키)
  # resid_rel_cap: 1.0e-4            # 후방 오차 η 로 수용할 때도 ‖Ku−F‖/‖F‖ 상한
  # equilibrium_tol_rel: 1.0e-6      # 반력 평형 |ΣR+ΣF|/max(|ΣF|,Σ|F|) 허용값(넘으면 SOLVER_SINGULAR)
  # (선택, v0.24.4) 새 지그 경로 SuperLU 분해 순서 — node_mmd(기본: 노드 블록 순서, tie 가 흩어진 큰 모델에서 분해 수 배 빠름) | default(예전 MMD)
  # jig_factor_order: node_mmd

validation:                          # 판정(PASS·조건부 PASS·FAIL) = 변위 4지표 + MAC(검증) (계약 esl_disp_primary.md·esl_validate_tiers.md)
  disp_rms_rel_max: 0.05             # [판정 DISP_RMS] RMS(u_val−u_rel)/max|u_rel| (전 노드, 미소 강체 제거 후) — PASS 상한(v0.24.5: 0.01 → 0.05)
  # disp_rms_rel_cond_max: 0.10      # (선택, v0.24.5) 변위 RMS 조건부 PASS 상한(없으면 max(0.10, disp_rms_rel_max))
  # mac_min: 0.95                    # (선택, v0.24.5) [판정 MAC] MAC(검증) = 변형 형상 일치(양쪽 선형 강체 제거) PASS 하한 (0, 1]
  # mac_cond_min: 0.90               # (선택, v0.24.5) MAC(검증) 조건부 PASS 하한(없으면 min(0.90, mac_min)). 역전(조건부 > PASS) = 설정 오류
  disp_max_rel_max: 0.05             # [판정 DISP_MAX] max|u_val−u_rel|/max|u_rel| (전 노드)
  reaction_rel_max: 1.0e-6           # [판정 REACTION] Σ|R_321|/Σ|F_eq| (자기평형이면 ≈0)
  disp_noise_rel_max: 1.0e-3         # [판정 DISP_NOISE] 변위 저장 정밀도 잡음 δ/max|u_rel| (추가 해석 없음)
  disp_top_n: 20                     # 변위 상위 노드 표 행 수
  disp_hist_bins: 20                 # 변위 오차 log10 히스토그램 bin 수
  hotspot_strain_rel_err_max: 0.10   # [참고 기준, 판정 아님] |ε_val−ε_rad|/ε_rad (hotspot 1위)
  hotspot_eval_count: 3              # 오차 표에 보일 hotspot 수
  full_solve: auto                   # S5 전체 재해석 solve(F_eq, 3-2-1): auto(직접법 메모리 추정 ≤ 가용 메모리 80% 면 수행) | always | never
                                     #   생략 시 판정 불가(UNDETERMINED) — 변위 비교·반력이 없어 변형률로 대신 판정하지 않음
  noise_samples: 3                   # 잡음 바닥 추정 섭동 표본 수(고정 시드)
  noise_force_rel_warn: 0.1          # rms(F_noise)/rms(F_eq) 초과 시 경고
  noise_strain_rel_max: 0.05         # [참고 기준, 판정 아님] hotspot |Δε_eq|/ε_eq (잡음)
  # sources: {enabled: true, reaction_tol: {fint: 0.10}, reaction_warn: {fint: 0.05}}   # (선택, v0.24.3) ④ 검증 출처별 — 경계력·내력 ESL 도 같은 정의·기준으로 검증(05_val/<출처>/). enabled 없으면 true, false = 전 노드만. reaction_tol = 출처별 반력 허용치(v0.24.5: 조건부 PASS 상한), reaction_warn = 주의 허용치(v0.24.5: PASS 상한)(없는 출처는 공통 1e-6 단일·주의 없음)

compare:                             # ESL 재현 정확도 전 요소 비교 (계약 esl_p2_library.md §7.2, 판정 기준은 임시값)
  min_rel: 0.1                       # valid = t* 에서 상승 중 ∧ ε_rad ≥ min_rel·max ε_rad(상승 요소)
  max_err_pct_max: 10.0              # [참고 기준, 판정 아님] 최대변형률 요소 |ε_esl−ε_rad|/ε_rad (%) 상한. 요소별 "기준 초과" 판정에도 사용
  p90_err_max: 20.0                  # [참고 기준, 판정 아님] valid 요소 |오차| 90 분위 (%) 상한
  top_n: 20                          # 상위 N 요소 표
  hist_bins: 20                      # 오차 히스토그램 bin 수
  section_band: 0.02                 # 단면선(ξ=0.5, η=0.5) 요소 띠 반폭(정규화 좌표, 요소 크기보다 작으면 요소 크기)

cumulative:                          # 누적 낙하 씬(rad 가 이전 런 상태 파일 .str/.sta 를 #include) — 계약 esl_cumulative_input.md
  enabled: auto                      # auto(상태 파일 include 가 있으면 켬) | off(상태 파일을 일반 include 로, 변형률 보정 없음)
  thickness_source: state            # state(상태 파일 THK = 변형 두께, 기본) | prop(원두께 — 교차검증용)
  epsp_agg: auto                     # 이전 소성 요소값 집계: auto | mid_mean | mid_max | max | mean
  h3d_epsp_mode: auto                # h3d Plastic Strain 이 이미 누적값인지: auto(frame0·단조성으로 판정) | cumulative | incremental
  h3d_eq_mode: auto                  # h3d Max_Strain ε_eq 도 같은 규칙
  min_increment: 1.0e-5              # 이번 낙하 증분이 이 이하인 요소(이전 손상만)는 t* 후보·hotspot 제외
  detect: {prev_floor: 1.0e-6, min_elems: 10, rel_tol: 0.05, mono_frac: 0.99}
  # max_npt: 100                    # (선택) /INISHE/EPSP_F 헤더 NPT 상한 · max_npg: 64 NPG 상한 — 넘으면 STATE_PARSE_ERROR

report:                              # Case HTML 보고서 <case>/07_report/report.html (자체 완결, 외부 의존 없음)
  max_points: 20000                  # 2D 컨투어 점 수 상한(초과 시 2D 셀 격자 다운샘플)
  top_forces: 20                     # F_eq 상위 표 행 수

export:
  radioss: {id_offset: auto, ramp_time: 1.0e-3, func_mode: ramp}   # id_offset: auto(기본; 9000000 부터, rad ID 와 겹치면 10의 거듭제곱으로 올림) | 정수. func_mode: ramp | constant
  force_zero_tol_rel: 1.0e-9         # |F 성분|/max|F| 이하 성분은 /CLOAD·FORCE 생략
  num_format: "{:.9E}"               # .fem·inc 실수 서식 (20자 이하)
  csv: {delimiter: ",", float_format: "{:.9E}"}

units: {label: "mm-ton-s", length: mm, force: N, stress: MPa, time: s}   # 표시용. 변환 없음

# (선택, v0.24.0 계약 esl_bforce.md §9) 경계력 ESL — 낙하 해석이 계산한 노드 힘(접촉력·tie 체결력·관성·내력)을 하중으로. 절이 없으면 아래 값.
# bforce:
#   enabled: false                   # (v0.24.5 기본 false — 사용자 결정, esl_validate_tiers.md §12) true = ESL 단계에서 경계력·내력 ESL 도 계산(h3d 추출에 결과가 있을 때)·추출 bf_on 1·보충 추출
#   on_demand: true                  # (v0.24.2) ③ ESL 때 선택 프레임 원자료가 추출물에 없으면(덤프 방식 등) h3d 에서 그 프레임만 보충(h3d 입력 Case). false = 보충 안 함
#   result_names:                    # h3d 결과 유형 이름 후보(정확 일치 → 대소문자·공백·밑줄 무시 일치). 현장 확인 이름을 앞에
#     cont: [Contact Forces, Contact Force, CONT]          # /H3D/NODA/CONT (현장 #82 확인)
#     cont2: [Tied Contact Forces, Contact Forces (TYPE2), CONT2]   # /H3D/NODA/CONT2 (tie 체결력, 표시명 미확인)
#     acc: [Acceleration, ACC]                              # /H3D/NODA/ACC (현장 #82 확인)
#     mass: [Nodal Mass, Mass, MASS]                        # /H3D/NODA/MASS (표시명 미확인)
#     fint: [Internal Forces, Internal Force, FINT]         # /H3D/NODA/FINT (표시명 미확인)
#   vec_comps: [X, Y, Z]             # 벡터 성분 이름('|' 로 대체 후보, 예 "X|x")
#   use_inertia: true                # 관성 항 −M·ACC 포함(false = 접촉력만)
#   balance: inertia_relief          # inertia_relief(관성 이완 — tie 누락 불평형을 강체 가속도로) | none
#   signs: {cont: 1, cont2: 1, fint: auto}   # 접촉력 = 노드에 작용하는 힘. fint auto = 분해와 맞는 부호/일 양수
#   default_rho: 7.85e-9             # 재료 밀도가 없을 때 deck 질량 근사 밀도(t/mm³, 경고 BF_RHO_DEFAULT)
#   g_mm_s2: 9810.0                  # ā 를 g 로 표시할 때(모델 단위)
#   recon_mac_min: 0.9               # 기준 재현 MAC 이 이보다 작으면 경고 BF_RECON_POOR
#   recon_umax_err_max: 0.2          # |umax 오차| 가 이보다 크면 경고 BF_RECON_POOR
#   reaction_warn_rel: 1.0e-3        # 3-2-1 반력 합/Σ|F| 가 이보다 크면 경고 BF_REACTION
#   fint_check_warn_rel: 0.05        # full 등급 FINT 검산 상대 오차 경고
#   fint:                            # (v0.24.0 보완, esl_fint.md) 내력 ESL — F = s·FINT(별도 출처 '내력 ESL', 경계력 ESL 은 접촉력 전용)
#     enabled: true                  # FINT 결과가 있으면 계산
#     balance: none                  # none(기본 — 부품 내력은 자기평형) | inertia_relief(잔차가 허용치를 넘을 때만 관성 이완)
#     unbalanced_force_rel: 1.0e-3   # 변형 형상 ‖ΣF‖/Σ‖F‖ 허용치(넘으면 FINT_UNBALANCED — 공유 노드 혼입·추출 누락 의심)
#     unbalanced_moment_rel: 1.0e-3  # 변형 형상 ‖ΣM‖/(Σ‖F‖·L) 허용치
#     shared_nodes: true             # 원 deck 에서 다른 부품 요소가 참조하는 대상 파트 노드(공유 노드)·회전 연결 노드 진단
#   plastic_eps_min: 0.002           # 소성 진단 문턱(t* 소성 변형률 εᵖ > 이 값인 요소 면적 비율·최대 εᵖ 표시 — 계산 변경 없음)

# (선택, v0.24.4 계약 esl_jig_case.md §11) 지그 ESL 3방식(고정·강제 변위·스프링) — ③ ESL 이 tie(체결) 노드로 지지한 파트에 몇 곳 하중을
# 맞춰 낙하 변형을 재현. tie 노드는 워커가 ESL 전에 준비(01_extract/jig_fixed — paicad fixed-scan). 절이 없으면 아래 값(esl.mech.jig.JIG_DEFAULTS).
# jig:
#   enabled: true                    # ③ ESL 에서 지그 ESL 도 계산(tie 준비 기록이 있을 때)
#   methods: [prescribed, spring]    # 계산할 방식(출처 행 jig·jig_disp·jig_spring). 빼면 그 행 = JIG_DISABLED. v0.24.5 기본에서 fixed(지그 고정) 제외(§12) — 넣으면 v0.24.4 와 같음
