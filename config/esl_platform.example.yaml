# ESL 플랫폼(P1b) 설정 예시 (계약 docs/contracts/esl_platform_p1b.md, 원형 esl.md §2).
# 실제 사용: config/esl_platform.yaml(git 제외)로 복사하거나 env ESL_PLATFORM_CONFIG 로 경로 지정.
# env ESL_PROFILE 이 profile 보다 우선. 모든 키 필수, 알 수 없는 키는 CONFIG_INVALID(쓰기 API 503).
# 서버에서 외부 프로그램을 실행하지 않으므로 altair·commands·resources 키는 없다.
schema_version: 1
profile: dev                          # dev | prod
server: {host: 127.0.0.1, port: 8110, base_path: /esl}   # API = {base_path}/api, 프런트 = {base_path}/
database: {url_env: ESL_DATABASE_URL, pool_size: 5}       # 값이 아니라 env 변수명. DB 이름 esl
auth:
  mode: dashboard                     # dashboard | dev_static(dev + 127.0.0.1 만)
  dashboard_internal_url: "http://127.0.0.1:8000"
  dashboard_public_login_url: "/"
  cookie_name: analysis_canvas_session
  introspection_path: /api/auth/me
  projects_path: /api/projects
  cache_ttl_s: 30
  timeout_s: 3
  dev_static_principal: {user_id: dev-admin, username: dev, display_name: 개발자, is_global_admin: true, memberships: []}
storage:
  esl_root: "E:/shared/ESL_WORK"      # Case 산출물 루트(쓰기). input_roots·spdm_roots 와 겹침 금지
  input_roots: []                     # rad·결과 CSV 폴더 선택 허용 루트(읽기 전용). 비어 있으면 입력 불가
  spdm_roots: []                      # 겹침 검사용
worker:
  limiter: auto                       # auto | none | posix | windows_job
  max_logical_cores: 16
  max_memory_gb: 32
  priority: below_normal              # normal | below_normal | idle
  heartbeat_interval_s: 10
  lease_ttl_s: 60
  claim_interval_s: 2
  cancel_check_interval_s: 2
  terminate_grace_s: 5                # 취소 시 코어 프로세스 terminate 후 kill 까지 대기
  env_passthrough: []
  state_dir: "./state"
ui:
  max_artifact_bytes: 20971520
  max_preview_points: 20000           # 지지점 화면 2D 산점 최대 점 수
  poll_job_ms: 2000
  poll_queue_ms: 5000
logging: {level: INFO, mask_patterns: ['(?i)(password|passwd|token|secret)\s*[=:]\s*\S+']}
core:                                 # 코어 설정: config_path(이 파일 기준 상대경로 가능) 또는 settings(코어 설정 그대로)
  config_path: esl.example.yaml
