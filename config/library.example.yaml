# ESL 라이브러리 · 종합분석 · 비드 최적화 덱 설정 예시 (계약 docs/contracts/esl_p2_library.md).
# 사용: python -m esl.library <명령> --config config/library.example.yaml  (또는 env ESL_LIBRARY_CONFIG)
# 모든 키 필수, 알 수 없는 키는 CONFIG_INVALID (esl.library.settings).
schema_version: 1

library:
  ista6: ista6.yaml                  # ISTA 6 면 번호·높이 표 (이 파일 기준 상대 경로)
  scene_regex: null                  # null = 기본 규칙(scene_meta.DEFAULT_SCENE_REGEX). 정규식 목록으로 교체 가능(named group:
                                     #   project model inch version date scenario seq drop_type round scene orient suffix variant)
  inch_regex: '^(?P<inch>\d{2,3})(?=\D|$)'   # inch 가 정규식에 없을 때 model 에서 추출
  optional_fields: [round, suffix, variant]  # 못 찾아도 경고하지 않는 필드
  axis_ref: {xi: [1.0, 0.0, 0.0], eta: [0.0, 0.0, 1.0], n: null}   # ξ≈+X(가로), η≈+Z(세로), n = ξ×η (n 은 경고용)
  grid: {nx: 24, ny: 14}             # 정규화 격자
  top_nodes: 50                      # 요약에 남길 상위 절점력 수
  require_pass: true                 # 검증 PASS 만 등록(FAIL 은 --confirm-fail "사유" 로 확정 등록)

analysis:
  svd_energy: 0.9                    # 누적 에너지 기준 모드 수
  n_representative: 5                # k-medoids 대표 씬 수
  seed: 0                            # k-medoids 무작위 초기화 시드(재현성)
  n_init: 8                          # 초기화 수(BUILD 1 + 무작위 n_init−1)
  worst_case: false                  # 클러스터별 Σ|f| 최대 씬을 하중 케이스로 추가
  normalization: none                # none | mass | inch2  (인치 간 하중 크기 정규화)
  moment_scale: preserve             # preserve(계약: 셀 합모멘트 보존) | geometric(크기비로 모멘트 비례)
  equilibrate: true                  # 매핑 후 전체 합력·합모멘트 잔차를 최소노름 보정(3-2-1 반력 방지)
  distance: pattern                  # pattern(행 단위 노름 → 패턴 유사도) | magnitude(크기 포함)
  svd_feature: cell                  # cell(대상 격자 셀 합력·합모멘트 — 원본/매핑 같은 해상도) | nodal(절점력)

optdeck:
  design_pids: null                  # null = 전 PID 설계. 목록이면 그 PID 만 설계
  nondesign_pids: []                 # 비설계 Radioss PID
  nondesign_node_ids: []             # 마운트 등 비설계 중심 노드 ID
  nondesign_radius: 0.0              # 위 노드에서 이 반경 안 노드를 쓰는 요소 = 비설계 (모델 길이 단위)
  bead: {min_width: 10.0, height: 3.0, angle: 60.0, buffzone: true, skip: BC, bounds: [0.0, 1.0]}
                                     # 비드 최소폭·높이(모델 길이 단위)·각도(deg). skip: BC|NONE (전 노드 하중이라 LOAD/BOTH 불가)
  objective: minmax                  # minmax (DESOBJ(MINMAX)+DOBJREF) | weighted (WCOMP + subcase WEIGHT)
  reference_compliance: none         # none(POS=1.0) | solve(자체 쉘 솔버로 subcase 기준 컴플라이언스 → POS, 상대 minmax)
  beadfrac_max: null                 # null = 사용 안 함. 값이면 BEADFRAC ≤ 값 제약(확신도 중하)
  id_offset: 9000000                 # 생성 ID(PSHELL·MAT1·SID·DTPG·DRESP) = id_offset+1 부터
  num_format: "{:.9E}"
  force_zero_tol_rel: 1.0e-9
  card_format: free                  # free(콤마, '+,' 연속) | fixed(최적화 카드만 8칸 고정형식)
  deck_name: esl_bead
  nt: 4                              # optistruct -nt
  solver: {drill_factor: 1.0e-4, backend: auto}   # reference_compliance: solve 일 때
