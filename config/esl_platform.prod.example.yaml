# ESL 플랫폼 운영 설정 예시(profile: prod) — Windows 서버(대시보드 simulation_workbench·physicsai-platform 과 같은 PC).
# 설치 스크립트(deploy/setup.ps1·install.ps1)가 이 파일로 <런타임>\config\esl_platform.yaml 을 만들고(없을 때만),
# 같은 폴더에 코어 설정 esl.yaml(config/esl.example.yaml), 라이브러리 설정 library.yaml(config/library.example.yaml),
# ISTA 6 표 ista6.yaml(config/ista6.yaml)을 없을 때만 복사한다. 이후 값은 그 파일에서 직접 고친다(다시 설치해도 덮어쓰지 않음).
# 스키마는 config/esl_platform.example.yaml 과 같다(모든 키 필수, 알 수 없는 키는 CONFIG_INVALID — 쓰기 API 503, 워커 기동 거부).
# 경로: 절대경로('/' 권장), 공백·& | < > ^ % ! " 금지. esl_root 는 input_roots·spdm_roots 와 겹치면 안 된다(SPDM 밖).
schema_version: 1
profile: prod                         # 운영. dev_static 인증 금지
server:
  host: 127.0.0.1                     # 루프백 전용(외부 접속은 대시보드 주소 /esl/ 경유 — Vite 프록시 또는 Caddy)
  port: 8110                          # physicsai(8100)·시연(8190·8191)과 겹치지 않게. 대시보드 .env VITE_ESL_TARGET(또는 Caddy ESL_PORT)과 같게
  base_path: /esl                     # API = /esl/api, 프런트 = /esl/ (프런트 빌드 base 와 같아야 함 — 바꾸지 않는다)
  frontend_root: null                 # 백엔드가 /esl/ 아래에 직접 서빙할 프런트 빌드 폴더(절대경로, 예 D:/esl-platform/.runtime/frontend).
                                      # git 폴더 설치(setup.ps1)는 <git>/.runtime/frontend 로 채운다(키가 없을 때만). null = 서빙 안 함(Caddy 등 외부 서빙)
database:
  url_env: ESL_DATABASE_URL           # 값이 아니라 환경변수 이름. 실행기(esl_service.py)가 <런타임>\secrets\database_url 을 이 이름으로 넣는다
  pool_size: 5
auth:
  mode: dashboard                     # 대시보드 세션 쿠키 introspection(같은 origin)
  dashboard_internal_url: "http://127.0.0.1:8000"    # 대시보드 백엔드(start.ps1 -BackendPort 기본 8000)
  dashboard_public_login_url: "/home/"               # 로그인·"대시보드로" 링크 — 설치 스크립트가 대시보드 .env WINDOWS_WEB_BASE_PATH 로 맞춤
  cookie_name: analysis_canvas_session
  introspection_path: /api/auth/me
  projects_path: /api/projects
  cache_ttl_s: 30
  timeout_s: 3
storage:
  esl_root: "E:/shared/ESL_WORK"      # Case 산출물 루트(쓰기, SPDM 밖). 설치 스크립트가 deploy.json esl_root 로 채우고 폴더를 만든다
  input_roots: []                     # rad·결과 CSV 폴더를 고를 수 있는 루트(읽기 전용). 비어 있으면 Case 를 만들 수 없다
  spdm_roots: []                      # SPDM master 루트(겹침 검사용 — esl_root 가 이 안에 있으면 거부)
  upload_root: null                   # 브라우저 업로드 저장 위치(절대경로, SPDM 밖, esl_root 와 겹침 금지 — input_roots 에 자동 포함).
                                      # 설치 스크립트가 <esl_root 부모>/esl-input 으로 채우고 폴더를 만든다(-UploadRoot 로 지정). null = 업로드 끔
  browse_spdm: false                  # 서버 폴더 찾아보기에 spdm_roots 를 읽기 전용으로 보이기(기본 끔)
worker:
  limiter: auto                       # auto | none | posix | windows_job (Windows는 Job Object로 메모리·CPU·우선순위 제한)
  max_logical_cores: 16
  max_memory_gb: 128                  # 워커 전체 메모리 예산(작업별 한도 = 이 값 / slots 또는 per_job_memory_gb. Windows: 작업마다 Job 커밋, 초과 시
                                      # SOLVER_OUT_OF_MEMORY). 근거: 운영 서버 RAM 512 GB(decisions.md), 30만 요소 직접법 RSS 약
                                      # 13 GB, 100만 요소 추정 45 GB(POSIX 는 × vm_headroom 1.5 ≈ 68 GB 가상)를 수용하고 대시보드·
                                      # physicsai 와 나눠 쓸 여유를 남김. 서버 RAM 이 다르면 그 1/4 정도로
  slots: 2                            # SLOT 레인 동시 작업 수(추출·ESL·검증 — 같은 Case 는 직렬). 작업별 코어 = max_logical_cores / slots
  per_job_memory_gb: null             # 작업 1개 메모리 한도(GB). null = max_memory_gb / slots(128 / 2 = 64 GB)
  vm_headroom: 1.5                    # POSIX 전용: RLIMIT_AS(가상 주소 공간) = max_memory_gb × 이 값(VmPeak > RSS 여유).
                                      # Windows Job 메모리는 커밋 기준이라 곱하지 않음(1.0)
  priority: below_normal              # normal | below_normal | idle (Windows: Job 우선순위 클래스, POSIX: nice)
  heartbeat_interval_s: 10
  lease_ttl_s: 60
  claim_interval_s: 2
  cancel_check_interval_s: 2
  terminate_grace_s: 5
  env_passthrough: []
  state_dir: "./state"                # 작업 폴더(<런타임>) 기준 → <런타임>\state
  xfer_lanes: 2                       # v0.11.0 XFER 레인(SCX 전송·원격 대기) 루프 수(1~8) — SLOT·LIGHT 와 독립
ui:
  max_artifact_bytes: 20971520
  max_preview_points: 20000
  poll_job_ms: 2000
  poll_queue_ms: 5000
  max_bundle_bytes: 5368709120        # 결과 받기(zip) 상한 5 GB — 넘으면 413 + 폴더 경로 안내
  browse_page_max: 1000               # 서버 폴더 찾아보기 한 번에 보이는 항목 수(넘으면 페이지)
  upload_slim_hint_gb: 5              # 브라우저 업로드 h3d 가 이 크기(GB)를 넘으면 압축 모드(PC 도구) 안내 한 줄. 0 = 안내 끔
upload:                               # 브라우저 분할 업로드(계약 esl_p3_ux.md §1.1)
  chunk_mb: 64                        # 새 세션의 청크 크기 C(MB, 세션에 고정) — 정렬 청크·청크별 sha256(X-Chunk-Sha256)·이어 올리기 단위
  parallel: 4                         # 업로드당 동시 청크 수(1..8, 초과 429) — 응답 max_parallel, 클라이언트는 min(자기 설정, 이 값)
  write_buffer_kb: 1024               # 청크 본문 스트리밍 쓰기 단위(요청당 메모리 ≈ 이 값의 2배)
  preallocate: true                   # .part 사전 할당(ftruncate). NTFS 에서 뒤 청크 쓰기가 느리면 false
  max_file_bytes: 68719476736         # 파일당 64 GB(h3d 30 GB 수용)
  max_upload_bytes: 107374182400      # 업로드당 100 GB
  min_free_gb: 20                     # 업로드 후에도 upload_root 드라이브에 남길 여유(부족하면 507)
  max_files: 5000
  max_concurrent_per_user: 2
  stale_hours: 72                     # 미완료 업로드를 _backup 으로 옮기는 시간(삭제 없음)
  allowed_ext: [.rad, .inc, .k, .csv, .json, .txt, .tcl, .h3d, .fem, .sta, .str, .step, .stp]   # .fem = 비드 최적화 S2 템플릿, .sta·.str = 누적 낙하 씬 상태 파일, .step·.stp = 비드 DOE STEP
  state_scan_kb: 4096                 # 업로드 complete 때 상태 파일 종류 판정에 읽는 앞부분(KB). 줄바꿈 없는 긴 줄도 이 이상 읽지 않음
altair:                               # 서버 h3d 추출(계약 esl_p3_ux.md §6) — 워커가 hw 를 직접 실행(shell 없이, argv 템플릿)
  version_label: "2026.1"
  hw_exe_path: "C:/Program Files/Altair/2026.1/hwdesktop/hw/bin/win64/hw.exe"   # 공백 허용(실행 파일만). 환경 점검이 존재 확인
  max_concurrent_hw: 2                # 동시 hw 수(HyperWorks 라이선스 한도에 맞춰 조정) — DB 세마포어, 넘으면 대기
  optistruct_path: "C:/Program Files/Altair/2026.1/hwsolvers/scripts/optistruct.bat"   # 비드 최적화(v0.7.0). 없거나 파일이 없으면 503
  max_concurrent_os: 1                # 동시 OptiStruct 수(라이선스 한도) — DB 세마포어
commands:                             # argv 템플릿(esl.md §4.4): argv[0] = {hw} 만. 허용 placeholder: hw, extract_tcl(_fwd), h3d(_fwd),
                                      # request(_fwd), out_dir(_fwd), part, hot_k, top_n. 치환값에 & | < > ^ % ! " 가 있으면 실행 전 거부
  h3d_extract: ["{hw}", "-clientconfig", "hwpost.dat", "-b", "-tcl", "{extract_tcl_fwd}", "-input", "{h3d_fwd}", "-part", "{part}", "-output", "{out_dir_fwd}", "-config", "{request_fwd}", "-hot_k", "{hot_k}", "-top_n", "{top_n}"]
  os_check: ["{optistruct}", "{fem}", "-check", "-tmpdir", "{scratch}"]     # 비드 최적화 덱 검사. argv[0] = {optistruct} 만
  os_solve: ["{optistruct}", "{fem}", "-nt", "{nt}", "-tmpdir", "{scratch}"]  # 허용 placeholder: optistruct, fem(_fwd), nt, work_dir, scratch, mem_mb
  bead_post: ["{hw}", "-clientconfig", "hwpost.dat", "-b", "-tcl", "{post_tcl_fwd}", "-input", "{h3d_fwd}", "-output", "{out_dir_fwd}", "-config", "{request_fwd}"]
  # v0.9.0 비드 DOE paicad argv 템플릿(esl_bead_doe.md §6.1): argv[0] = {paicad} 만(→ bead_doe.paicad.exe). `{x?}` = 선택 자리
  # (값이 null 이면 바로 앞 플래그와 함께 빠짐, 빈 문자열은 유지). 워커만 실행(shell 없이), 경로는 _doe/<id>/ 안·검사 통과 입력만
  paicad_version: ["{paicad}", "version", "--json"]
  paicad_fixed_scan: ["{paicad}", "shell", "fixed-scan", "--assem-dir", "{assem_dir}", "--parts", "{parts}", "--out-dir", "{out_dir}", "--options", "{options?}", "--threads", "{threads}"]
  paicad_extract: ["{paicad}", "shell", "extract", "--cad", "{cad}", "--out-dir", "{out_dir}", "--assem-dir", "{assem_dir?}", "--body-map", "{body_map?}", "--options", "{options?}", "--threads", "{threads}"]
  paicad_tag: ["{paicad}", "shell", "tag", "--cad", "{cad}", "--features", "{features}", "--assem-dir", "{assem_dir}", "--fixed-dir", "{fixed_dir}", "--out-dir", "{out_dir}", "--body-map", "{body_map?}", "--options", "{options?}", "--threads", "{threads}"]
  paicad_grid: ["{paicad}", "shell", "view", "grid", "--cad", "{cad}", "--features", "{features}", "--cells", "{cells}", "--thumb-options", "{thumb}", "--fixed-dir", "{fixed_dir}", "--out-dir", "{out_dir}", "--options", "{options?}", "--threads", "{threads}"]
  paicad_run: ["{paicad}", "shell", "run", "--cad", "{cad}", "--features", "{features}", "--values", "{values}", "--assem-dir", "{assem_dir}", "--tag-dir", "{tag_dir}", "--fixed-dir", "{fixed_dir}", "--update-dir", "{update_dir}", "--morph-dir", "{morph_dir}", "--check-dir", "{check_dir}", "--out-files-dir", "{out_files_dir}", "--body-map", "{body_map?}", "--options", "{options?}", "--threads", "{threads}"]
  paicad_update: ["{paicad}", "shell", "update", "--cad", "{cad}", "--features", "{features}", "--values", "{values}", "--out-dir", "{out_dir}", "--options", "{options?}", "--threads", "{threads}"]
client_token:                         # PC 연결(계약 esl_p3_ux.md §9.1): 연결 코드 → PC 토큰 esl_ct_…(서버엔 해시만)
  ttl_days: 30                        # 토큰 유효 기간
  code_ttl_min: 15                    # 연결 코드 유효 시간(1회용)
  lock_per_source: 5                  # 코드 교환 실패 잠금: 출발지(PC 주소)를 구분할 수 있으면 출발지별 허용 횟수
  lock_global: 30                     # 출발지를 구분할 수 없으면(신뢰하지 않는 루프백 프록시 뒤) 서버 전체 허용 횟수
  lock_minutes: 15                    # 실패를 세는 창·잠금 시간(분)
  trusted_proxies: []                 # X-Forwarded-For 를 믿을 프록시 주소·CIDR. deploy/caddy(Caddy 2.5+ 는 받은 XFF 를 버리고
                                      # 실제 주소를 붙임) 뒤라면 ["127.0.0.1", "::1"]. 비우면 루프백 peer 요청은 서버 전체 기준
logging:
  level: INFO
  mask_patterns: ['(?i)(password|passwd|token|secret)\s*[=:]\s*\S+']
core:                                 # 코어 설정: config_path(이 파일 기준 상대경로) 또는 settings
  config_path: esl.yaml               # = config/esl.example.yaml 복사본 — 판정 기준(validation·compare)은 사내 확인 후 교체
report:
  auto: true                          # VALIDATE 성공 시 Case 보고서(CASE_REPORT) 자동 → <case>\07_report\report.html
view3d:                               # ④ ESL 3D 하중 보기 파생 캐시(계약 esl_3d_load.md §10) — 섹션이 없어도 아래 기본값
  enabled: true
  max_nodes: 2000000                  # 초과 시 413 VIEW3D_TOO_LARGE(캐시 안 함)
  max_glb_bytes: 67108864             # 64 MiB — part.glb+part_lod.glb, values.bin 각각
  lod_min_nodes: 500000               # 초과 시 part_lod.glb 추가
  lod_target_vertices: 100000
  top_max: 100                        # manifest 상위 행 수(= 화살표 최대)
  cluster_k_max: 5
  kmeans_max_iter: 50
  build_wait_s: 60                    # 생성 대기 초과 시 503 VIEW3D_BUSY
library:                              # 라이브러리·종합분석·덱(esl.library.settings): config_path 또는 settings
  config_path: library.yaml           # library.yaml 의 library.ista6 = ista6.yaml(같은 폴더). 블록을 지우면 라이브러리 쓰기 API 503
opt_run:                              # v0.7.0 비드 최적화 서버 실행(계약 esl_opt_run.md §11). 섹션이 없으면 enabled: false
  enabled: true                       # 실행에는 altair.optistruct_path(OptiStruct)·hw_exe_path(후처리 HyperView)가 필요(없으면 503)
  max_entries: 200                    # 한 실행에 넣을 수 있는 ESL 최대 수
  size: {tol_rel: 0.02, plate_tol_rel: 0.05, require_inch: true}    # S2: ESL 간 ±2 %, 템플릿 ±5 %, 같은 인치
  template: {max_elems: 500000, flat_tol_rel: 0.02, max_tria_frac: 0.2}
  bead_defaults: {angle: 45.0, min_width: 60.0, height: 10.0}      # 화면 기본값(deg, mm, mm)
  keepout: {hole_radius_mm: 15.0, edge_band_mm: 10.0, hole_min_perimeter_mm: 5.0, max_rects: 20, frame_warn_mm: 1.0, rect_name_max: 40}
  loads: {default_strategy: A, mac_merge: 0.95, max_cases: 20, default_k: 5, default_objective_norm: abs, linkage: average, c0_tol: 0.05}
  mode:                               # 변형 모드 분류(§7.4) — 값 변경 시 rule_version 올림(auto 만 다시 계산, 사용자 수정 유지)
    rule_version: 1
    dent_resid_min: 0.5
    dent_conc_min: 0.6
    dent_area_frac: 0.05
    min_energy_rel: 1.0e-6
  solver: {drill_factor: 1.0e-4, backend: auto}                    # 초기 컴플라이언스 자체 솔버
  solve:
    nt: 4
    desmax: 30
    timeout_h: 12
    log_tail_lines: 2000
    error_patterns: ['(?m)^\s*\*\*\* ERROR']
    converged_patterns: ['OPTIMIZATION HAS CONVERGED']
    license_patterns: ['(?i)license.*(not available|checkout failed|insufficient|exceeded)', '(?i)ALM_\w+_ERROR']
    license_retry: {max: 3, wait_s: 300}                           # 라이선스 부족: 3회 × 300 초 자동 재시도 후 실패
    # iteration_pattern·objective_pattern·compliance_pattern·memory_patterns: 기본값은 서버 내장(backend core/config.py).
    # 실기 .out 형식이 다르면 여기서 정규식으로 덮어쓴다 — docs/manual/opt_run_check.md V-OR-R1 ②
    # OptiStruct 메모리 {mem_mb} = worker.per_job_memory_gb(없으면 max_memory_gb) × 1024 — os_solve 에 "-len", "{mem_mb}" 를 넣을 때만 쓰임
    env: {}                           # 허용 키 ALTAIR_LICENSE_PATH·ALTAIR_HOME·OMP_*
  post: {png_px: [1600, 900], bead_area_thr_rel: 0.1, report_map_cells: [96, 54]}
  check: {bead_width_elem_factor: 2.0, min_nodes_per_cell: 64, max_aspect: 10.0, max_warp_deg: 15.0}
  grid: {nx: 24, ny: 14}
  ui: {max_preview_points: 20000}     # 평면도(plan-view) 요소 점 최대 수
bead_doe:                             # v0.9.0 비드 형상 DOE(계약 esl_bead_doe.md §14). 섹션이 없으면 enabled: false
  enabled: true                       # 실행에는 paicad(≥ min_version, OCP 포함)가 필요 — 워커가 점검해 기록(없으면 화면 비활성)
  part_title: "chassis rear"          # ② B 메시 기본 파트 제목(case.part_title 과 같은 규칙)
  max_entries: 50
  max_designs: 200                    # 공칭 d000 포함 안 수 상한
  step_max_mb: 200
  same: {max_assem_mb: 4096}          # ① 기준 Case 입력 폴더 rad/inc 합계 상한(넘으면 422 ASSEM_TOO_LARGE → ② 안내)
  paicad:
    exe: null                         # setup_config 자동 감지(<런타임 venv>/Scripts 의 paicad 실행 파일이 있을 때만)
    min_version: "0.14.0"
    pinned_version: "0.14.0"          # deploy/paicad.lock 과 같게(다르면 경고만)
    threads: 4
    timeout_s: {version: 60, fixed_scan: 3600, extract: 3600, tag: 3600, grid: 7200, run: 3600, update: 1800}
    options: {}                       # paicad shell options.json 내용(선택, 비면 --options 생략)
    env: {}
    keep_files_top: 3                 # 순위 상위 k + 베이스라인만 paicad 사본(out_files·morph/files) 보존
    check_interval_s: 600             # 워커 paicad/gmsh 점검 주기
  mesh: {size_min_mm: 1.0, size_max_mm: 20.0, min_size_factor: 0.2, curvature_n: 12, algorithm: 8, min_quad_frac: 0.8, max_elems: 500000, timeout_s: 1800, occ_sew_faces: 0}
  doe: {default_method: lhs, default_n: 30, seed: 1, levels_default: 3, levels_max: 9, round_mm: 0.01, default_types: [D, W]}
  preview: {w: 320, h: 240, view_dir: auto, tilt_deg: 20, margin: 1.15, disp_range_mm: auto}
  run: {parallel: 2, memory_margin: 0.7}
  solve: {reaction_warn: 0.01}        # 솔버 drill_factor·backend 는 opt_run.solver 재사용
  boundary: {fastener_warn_mm: 10.0, load_warn_mm: 20.0, load_share_min: 0.2}
  view3d: {top_k: 3}
  rank: {ratio_tol: 1.0e-6, per_esl_inline_max: 2000}   # v0.10.0 ESL별 개선 지표('변화 없음' 허용치 — ③ 은 noise_floor 반영, 순위 행 per_esl 상한)
  settings_cache_s: 300               # GET /doe/settings 의 워커 점검 기록 캐시(초)
hpc:                                  # v0.11.0 대시보드 SCX 릴레이(계약 esl_scx_relay.md §6). 키 이름 = physicsai hpc.scx.*(블록 복사) + client_name
  scx:                                # 섹션이 없으면 SCX 기능 전부 비활성. 값이 틀려도 기동은 하고 SCX 기능만 비활성(환경 점검 hpc.scx)
    relay_url: ""                     # 필수. http://127.0.0.1:<대시보드 백엔드 포트>(loopback·포트만 — 화면·프록시 포트 아님)
    secret_file: ""                   # 필수. 절대경로(대시보드 SIMDASH_SCX_RELAY_SECRET_FILE 과 같은 파일 권장 — 복사 금지)
    client_name: "esl"                # X-SCX-Relay-Client(^[a-z0-9_-]{1,32}$)
    drive_base: "~/esl"               # 검증 낙하(v0.12.0) 쓰기 기준("~" | "~/<상대>") — 대시보드 relay_base 안
    home_display: "/Users/vd.dashboard"   # 표시 전용
    appliance: ""                     # 검증 낙하 필수(비면 그 기능만 비활성 SCX_APPLIANCE_MISSING)
    version: "26.1"
    ncpu: 16
    memory_gb: null
    queue_type: "implicit"
    run_type: "both - use starter and engine files"
    mpi: "Pure MPI"
    single_precision: false
    poll_interval_s: null
    max_download_bytes: 68719476736   # 64 GiB(대시보드 SIMDASH_SCX_RELAY_MAX_DOWNLOAD_BYTES 도 맞춰야 함 — 기본 20 GiB)
    stage_patterns: ["*.rad", "*.inc", "*.k", "*.sta", "*.str"]
    list_additional_paths: true
    max_stage_bytes: 21474836480
    stage_poll_s: 5
    stage_timeout_s: 14400
    submit_replay_attempts: 3
    submit_replay_wait_s: 10
    http_timeout_s: 30
    transfer_timeout_s: 14400         # 30 GB h3d: 대시보드 임시 받기 + 스트리밍
    collect_max_depth: 2
    health_ttl_s: 30
scx_drive:                            # v0.11.0 기능 A — 새 Case 'SCX 드라이브에서 고르기'(내려받기는 워커 XFER 작업, 드라이브 쓰기 없음)
  enabled: false
  roots:                              # 릴레이 홈 기준 상대(첫 구간 '.' 금지, SPDM 루트 밖). 0개면 A 비활성(SCX_NO_ROOTS)
    - {key: "drop", label: "낙하해석 공유", rel: "share/drop", projects: []}   # projects [] = 모든 프로젝트
  list_max_entries: 5000              # 릴레이 max_entries(1~50000) — 화면 페이지는 ui.browse_page_max
  max_files: 2000                     # rad + include + 엔진 rad 합계
  engine_globs: ["{stem}_0001.rad", "{stem}_000[2-9].rad"]
  file_retries: 2                     # 재시도 가능한 오류(전송·SCX_BUSY·해시 불일치) 파일당 재시도
  retry_wait_s: 30
verify_drop:                          # 기능 B — Radioss 검증 낙하(v0.12.0, 계약 esl_scx_relay.md §6)
  enabled: false
  max_scenes: 5
  default_worst_n: 3
  max_running: 2
  est_hours_per_scene: 3
  poll_s: 60
  max_wait_h: 72
  lost_after_polls: 10
  engine_globs: ["{stem}_0001.rad", "{stem}_000[2-9].rad"]
  result_globs: {h3d: ["*.h3d"], out: ["*_0000.out", "*_0001.out"]}
  out_ok_patterns: ["NORMAL TERMINATION"]
  out_error_patterns: ["(?m)^\\s*ERROR TERMINATION", "(?i)\\*\\*\\s*ERROR"]
  max_result_bytes: 68719476736
  compare: {same_tol: 0.02, hot_n: 20}
